<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fomi Assistant</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script type="module" src="/scripts/main.js" defer></script>
  </head>

  <body>
    <div id="character-container">
      <img 
        src="assets/fomi/fomi-idle.png" 
        id="fomi-avatar" 
        draggable="false" 
      />

      <div id="subtitle-container" class="hidden">
        <p id="subtitle-text"></p>
      </div>
    </div>

    <div id="context-menu" class="hidden">
      <div class="menu-item" id="menu-open-dashboard">🎛 Dashboard</div>
      <div class="menu-item" id="menu-reset">🧠 Reset Memory</div>
      <div class="separator"></div>
      <div class="menu-item danger" id="menu-close">❌ Close Fomi</div>
    </div>

    <div id="confirmation-modal" class="hidden">
      <div class="modal-content">
        <h3>Memory Management</h3>
        <p>Would you like to wipe the long-term memory?</p>

        <div class="modal-actions">
          <button id="btn-confirm-yes">Yes, wipe it</button>
          <button id="btn-confirm-no">No, keep it</button>
        </div>
      </div>
    </div>
  </body>
</html>
